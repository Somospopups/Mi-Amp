name: Build & Publish MI AMP Windows x64 (.exe Installer)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'CMakeLists.txt'
      - 'Source/**'
      - 'Resources/**'
      - 'installer_win64.nsi'
      - '.github/workflows/**'
  tags:
    - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64 (.exe Installer VST3 + Standalone)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Plugin (VST3 + Standalone)
        run: cmake --build build --config Release --parallel

      - name: Build NSIS Windows Installer (.exe)
        shell: pwsh
        run: |
          if (!(Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }
          $nsis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (!$nsis) { $nsis = "C:\Program Files (x86)\NSIS\makensis.exe" }
          & $nsis installer_win64.nsi

      - name: Upload Windows .exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-x64-Installer
          path: Instalar_MI_AMP_Windows_x64.exe

      - name: Publish Windows Release (.exe)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "v1.0.0-win"
          if (gh release view $tag 2>$null) {
            gh release upload $tag Instalar_MI_AMP_Windows_x64.exe --clobber
          } else {
            gh release create $tag Instalar_MI_AMP_Windows_x64.exe `
              --title "MI AMP Bass Edition v1.0.0 (Windows x64 Installer)" `
              --notes "Instalador oficial de MI AMP para Windows 64-bit (VST3 + App Standalone):`n- Cabezal de Bajo 8x10 Valvular con Smart Cab Handoff`n- Pedalera de 5 pedales (Compresor, XV Bass, Chorus, Phaser, Reverb)`n- Drop Tuner (-12/+12 semitonos) y Afinador YIN`n- 15 Presets (Iniciales + 11 XV Bass) + Presets de usuario" `
              --latest
          }
