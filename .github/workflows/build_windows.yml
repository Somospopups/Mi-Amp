name: Build & Publish MI AMP Windows x64 (.exe Installer)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'CMakeLists.txt'
      - 'Source/**'
      - 'Resources/**'
      - 'installer_win64.nsi'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64 (.exe Installer VST3 + Standalone)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Plugin (VST3 + Standalone)
        run: cmake --build build --config Release --parallel

      - name: Build NSIS Windows Installer (.exe)
        shell: pwsh
        run: |
          if (!(Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }
          $nsis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (!$nsis) { $nsis = "C:\Program Files (x86)\NSIS\makensis.exe" }
          & $nsis installer_win64.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows .exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-x64-Installer
          path: Instalar_MI_AMP_Windows_x64.exe

      - name: Publish Windows Release (.exe)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "v1.0.0-win"
          $notes = "Instalador oficial de MI AMP para Windows 64-bit (VST3 + App Standalone): Cabezal 8x10, Pedalboard de 5 pedales (XV Bass, Compresor, Chorus, Phaser, Reverb), Drop Tuner, Afinador YIN y 15 Presets."
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag Instalar_MI_AMP_Windows_x64.exe --clobber
          } else {
            gh release create $tag Instalar_MI_AMP_Windows_x64.exe --title "MI AMP Bass Edition v1.0.0 (Windows x64 Installer)" --notes $notes --latest
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
